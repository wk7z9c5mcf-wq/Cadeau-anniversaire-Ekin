<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dossier Secret Ekin</title>
  <link rel="stylesheet" href="style.css">

  <style>
 .home-page .page {
  width: min(850px, 100%);
  padding: clamp(20px, 3vw, 36px);
  border: 1px solid #a9735b99;
  border-radius: 24px;
  background: rgba(255, 247, 232, .62);
  box-shadow: 0 12px 35px #49372c24;
  backdrop-filter: none;
}

.home-page .page > p {
  color: #563b35;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.8;
  text-align: center;
  text-shadow: 0 1px 2px #fff;
}

.home-page .menu {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  column-gap: 42px;
  row-gap: 30px;
  margin-top: 28px;
}

.home-page .menu-item {
  position: relative;
  isolation: isolate;
  display: grid;
  min-height: 105px;
  place-items: center;
  padding: 16px 12px;
  border: 2px solid #a77b62;
  border-radius: 24px 24px 38px 38px;
  background: linear-gradient(145deg, #f5e7d3, #ddc2a5);
  box-shadow: 0 5px 0 #aa8067, 0 8px 14px #49372c25;
  color: #563b35;
  font-weight: 700;
  text-align: center;
  text-decoration: none;
  transition: transform .2s, box-shadow .2s;
}

/* Anse placée presque entièrement à l’extérieur, derrière la tasse */
.home-page .menu-item::before {
  position: absolute;
  z-index: -1;
  top: 30px;
  right: -36px;
  width: 40px;
  height: 36px;
  border: 7px solid #a77b62;
  border-left: 0;
  border-radius: 0 50% 50% 0;
  content: "";
  pointer-events: none;
}

.home-page .menu-item:nth-last-child(2) {
  grid-column: 2;
}

.home-page .menu-item:last-child {
  grid-column: 3;
  justify-self: stretch;
  width: auto;
}

@media (max-width: 760px) {
  .home-page .menu-item:nth-last-child(2),
  .home-page .menu-item:last-child {
    grid-column: auto;
    width: auto;
  }
}

@media (max-width: 420px) {
  .home-page .page {
    padding: 18px;
    background: rgba(255, 247, 232, .68);
  }

  .home-page .menu {
    column-gap: 28px;
    row-gap: 20px;
  }

  .home-page .menu-item {
    min-height: 88px;
    padding: 12px 8px;
    font-size: 14px;
  }

  .home-page .menu-item::before {
    right: -25px;
    width: 29px;
    height: 32px;
    border-width: 6px;
    border-left: 0;
  }
}
.home-page .menu-item.is-locked {
  filter: grayscale(.55);
  opacity: .7;
}

.home-page .lock-badge {
  position: absolute;
  top: 7px;
  right: 9px;
  font-size: 17px;
}

#progressMessage {
  min-height: 24px;
  color: #79404b;
  font-weight: 700;
}
</style>
</head>
<script src="musique.js"></script>
<body class="home-page">
  <main class="page">
<h1 id="pageTitle">Téléphone déverrouillé… à qui est-il ?</h1>
<p id="birthdayText" hidden>
  20 ans d'existence.<br>
  0 défaut.<br>
  100 % de charisme.
</p>
<p id="progressMessage" aria-live="polite"></p>

<nav class="menu">
  <a class="menu-item" href="enquete.html">🕵️ Enquête</a>
  <a class="menu-item" href="dossier.html">📁 Dossier secret</a>
  <a class="menu-item" href="aimes.html">❤️ Tu nous aimes ?</a>
  <a class="menu-item" href="simulateur.html">🎮 Jeux vidéo 1</a>
  <a class="menu-item" href="jeux-video.html">🎮 Jeux vidéo 2</a>
  <a class="menu-item" href="activites.html">📅 Activités secrètes</a>
  <a class="menu-item" href="roulette.html">🎰 Roulette du chaos</a>
  <a class="menu-item" href="univers.html">🌍 Univers parallèles</a>
  <a class="menu-item" href="simulatrice.html">🤖 Meilleure amie</a>
  <a class="menu-item" href="mystere.html">🧩 Le grand mystère</a>
</nav>
  </main>

<script>
  const storyLinks = [...document.querySelectorAll(".menu-item")];
  const unlockedKey = "ekin-unlocked-pages";
  const pendingKey = "ekin-page-in-progress";
  const message = document.getElementById("progressMessage");
  const pageTitle = document.getElementById("pageTitle");
  const birthdayText = document.getElementById("birthdayText");

  let unlocked = Number(localStorage.getItem(unlockedKey) || 0);
  const pending = localStorage.getItem(pendingKey);

  if (pending !== null) {
    const finishedIndex = Number(pending);
    unlocked = Math.max(unlocked, finishedIndex + 1);
    localStorage.setItem(unlockedKey, String(unlocked));
    localStorage.removeItem(pendingKey);

    const nextLink = storyLinks[finishedIndex + 1];
    message.textContent = nextLink
      ? `🗝️ Bravo ! La clé a ouvert : ${nextLink.textContent.trim()}`
      : "🏆 Tu as terminé toute l’enquête du téléphone !";
  }

  // Après l’enquête, l’identité du téléphone est révélée.
  if (unlocked >= 1) {
    pageTitle.textContent = "Joyeux anniversaire Ekin";
    birthdayText.hidden = false;
  }

  storyLinks.forEach((link, index) => {
    if (index > unlocked) {
      link.classList.add("is-locked");
      link.setAttribute("aria-disabled", "true");
      link.title = "Cette page est encore verrouillée";

      const lock = document.createElement("span");
      lock.className = "lock-badge";
      lock.setAttribute("aria-hidden", "true");
      lock.textContent = "🔒";
      link.appendChild(lock);

      link.addEventListener("click", (event) => event.preventDefault());
    } else {
      link.addEventListener("click", () => {
        localStorage.setItem(pendingKey, String(index));
      });
    }
  });
</script>

</body>
</html>
